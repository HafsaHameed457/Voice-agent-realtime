<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Agent</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0e0e10; color: #e0e0e0; height: 100vh; display: flex;
    justify-content: center; align-items: center;
  }
  .container {
    width: 480px; max-width: 100vw; height: 100vh; max-height: 860px;
    display: flex; flex-direction: column; padding: 24px;
  }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  header h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; }
  #status-badge {
    padding: 4px 14px; border-radius: 20px; font-size: 13px; font-weight: 500;
    background: #2a2a2e; color: #999;
    transition: background .3s, color .3s;
  }
  #status-badge.connected { background: #1a3a2a; color: #4ade80; }
  #status-badge.error { background: #3a1a1a; color: #f87171; }

  .call-area {
    display: flex; flex-direction: column; align-items: center;
    padding: 32px 0; gap: 12px;
  }
  #callBtn {
    width: 120px; height: 120px; border-radius: 50%; border: none;
    font-size: 16px; font-weight: 600; cursor: pointer;
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: white; transition: all .3s; box-shadow: 0 4px 24px rgba(59,130,246,.3);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px;
  }
  #callBtn:hover:not(:disabled) { transform: scale(1.05); box-shadow: 0 6px 32px rgba(59,130,246,.4); }
  #callBtn:active:not(:disabled) { transform: scale(.95); }
  #callBtn.active { background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 4px 24px rgba(239,68,68,.3); }
  #callBtn.active:hover { box-shadow: 0 6px 32px rgba(239,68,68,.4); }
  #callBtn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  #callBtn .icon { font-size: 32px; line-height: 1; }
  #callBtn .label { font-size: 13px; }

  .meter-container { width: 200px; height: 6px; background: #1a1a1e; border-radius: 3px; overflow: hidden; }
  #meter-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #4ade80, #22d3ee); border-radius: 3px; transition: width .1s; }

  .indicator-row { display: flex; gap: 16px; font-size: 13px; color: #888; }
  .indicator-row .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #2a2a2e; margin-right: 6px; vertical-align: middle;
    transition: background .3s;
  }
  .indicator-row .dot.active { background: #22c55e; }
  .indicator-row .dot.speaking { background: #f59e0b; }

  #transcript {
    flex: 1; overflow-y: auto; padding: 16px 0;
    display: flex; flex-direction: column; gap: 12px;
    scroll-behavior: smooth;
  }
  #transcript::-webkit-scrollbar { width: 4px; }
  #transcript::-webkit-scrollbar-track { background: transparent; }
  #transcript::-webkit-scrollbar-thumb { background: #2a2a2e; border-radius: 2px; }

  .msg { padding: 10px 14px; border-radius: 12px; max-width: 85%; line-height: 1.5; font-size: 14px; animation: fadeIn .3s; }
  .msg.user { align-self: flex-end; background: #1e3a5f; color: #93c5fd; }
  .msg.assistant { align-self: flex-start; background: #1a1a1e; color: #d4d4d8; }
  .msg .role-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; opacity: .6; }
  .msg .time { font-size: 11px; opacity: .4; margin-top: 4px; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🎙 Voice Agent</h1>
    <span id="status-badge">Disconnected</span>
  </header>

  <div class="call-area">
    <button id="callBtn">
      <span class="icon">📞</span>
      <span class="label">Call Agent</span>
    </button>
    <div class="meter-container">
      <div id="meter-bar"></div>
    </div>
    <div class="indicator-row">
      <span><span class="dot" id="listening-dot"></span>Listening</span>
      <span><span class="dot" id="speaking-dot"></span>Speaking</span>
    </div>
  </div>

  <div id="transcript"></div>
</div>

<script>
// ─── Audio constants ───────────────────────────────────────────────
const TARGET_RATE = 24000;
const BUFFER_SIZE = 4096;

// ─── Mu-law lookup table ───────────────────────────────────────────
const BIAS = 0x84;
const CLIP = 32635;
const mulawDecode = new Int16Array(256);
for (let i = 0; i < 256; i++) {
  const sign = (i & 0x80) ? -1 : 1;
  const exponent = (i >> 4) & 0x07;
  const mantissa = i & 0x0F;
  const sample = ((mantissa << 3) + BIAS) << exponent;
  mulawDecode[i] = sign * (sample - BIAS);
}

// ─── DOM refs ──────────────────────────────────────────────────────
const statusBadge = document.getElementById('status-badge');
const callBtn = document.getElementById('callBtn');
const transcriptEl = document.getElementById('transcript');
const meterBar = document.getElementById('meter-bar');
const listeningDot = document.getElementById('listening-dot');
const speakingDot = document.getElementById('speaking-dot');

// ─── State ─────────────────────────────────────────────────────────
let ws = null;
let audioCtx = null;
let source = null;
let processor = null;
let stream = null;
let isCallActive = false;
let isAgentSpeaking = false;
let audioQueue = [];
let isPlaying = false;

// ─── Helpers ───────────────────────────────────────────────────────
function setStatus(text, cls) {
  statusBadge.textContent = text;
  statusBadge.className = cls || '';
}

function addMessage(role, text) {
  const el = document.createElement('div');
  el.className = `msg ${role}`;
  const label = role === 'user' ? 'You' : 'Agent';
  const time = new Date().toLocaleTimeString();
  el.innerHTML = `<div class="role-label">${label}</div>${escHtml(text)}<div class="time">${time}</div>`;
  transcriptEl.appendChild(el);
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ─── Audio playback (mulaw → PCM16 → AudioContext) ────────────────
function queueAudio(mulawB64) {
  const mulawBytes = Uint8Array.from(atob(mulawB64), c => c.charCodeAt(0));
  const pcm = new Int16Array(mulawBytes.length);
  for (let i = 0; i < mulawBytes.length; i++) pcm[i] = mulawDecode[mulawBytes[i]];
  audioQueue.push(pcm);
  if (!isPlaying) playNext();
}

function playNext() {
  if (audioQueue.length === 0) { isPlaying = false; return; }
  isPlaying = true;
  const pcm = audioQueue.shift();
  const buf = audioCtx.createBuffer(1, pcm.length, TARGET_RATE);
  const ch = buf.getChannelData(0);
  for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 32768;
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.connect(audioCtx.destination);
  src.onended = playNext;
  src.start();
}

// ─── Audio capture (mic → PCM16 @ 24kHz → base64 → WebSocket) ────
function resampleFloat32(input, fromRate, toRate) {
  if (fromRate === toRate) return input;
  const ratio = fromRate / toRate;
  const outLen = Math.round(input.length / ratio);
  const out = new Float32Array(outLen);
  for (let i = 0; i < outLen; i++) {
    const pos = i * ratio;
    const idx = Math.floor(pos);
    const frac = pos - idx;
    out[i] = idx + 1 < input.length
      ? input[idx] + frac * (input[idx + 1] - input[idx])
      : input[idx];
  }
  return out;
}

function float32ToInt16Pcm(samples) {
  const out = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    out[i] = s < 0 ? s * 32768 : s * 32767;
  }
  return out;
}

function int16ToBase64(pcm) {
  const bytes = new Uint8Array(pcm.length * 2);
  for (let i = 0; i < pcm.length; i++) {
    bytes[i * 2] = pcm[i] & 0xff;
    bytes[i * 2 + 1] = (pcm[i] >> 8) & 0xff;
  }
  let binary = '';
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary);
}

function onAudioProcess(e) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  if (isAgentSpeaking) return;
  const input = e.inputBuffer.getChannelData(0);
  const resampled = resampleFloat32(input, audioCtx.sampleRate, TARGET_RATE);
  const pcm = float32ToInt16Pcm(resampled);
  const b64 = int16ToBase64(pcm);
  ws.send(JSON.stringify({ type: 'audio', audio: b64 }));
}

// ─── Microphone start/stop ─────────────────────────────────────────
async function startMic() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  source = audioCtx.createMediaStreamSource(stream);
  processor = audioCtx.createScriptProcessor(BUFFER_SIZE, 1, 1);
  processor.onaudioprocess = onAudioProcess;
  source.connect(processor);
  processor.connect(audioCtx.destination);

  // Audio level meter
  const analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  source.connect(analyser);
  const data = new Uint8Array(analyser.frequencyBinCount);
  function meterLoop() {
    if (!isCallActive) return;
    analyser.getByteFrequencyData(data);
    const avg = Array.from(data).reduce((a, b) => a + b, 0) / data.length;
    meterBar.style.width = Math.min(100, avg * 1.8) + '%';
    requestAnimationFrame(meterLoop);
  }
  meterLoop();
}

function stopMic() {
  if (processor) { processor.disconnect(); processor = null; }
  if (source) { source.disconnect(); source = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  meterBar.style.width = '0%';
}

// ─── WebSocket ─────────────────────────────────────────────────────
function connectWS() {
  const sessionId = 'browser_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const host = location.host;
  const url = `${proto}//${host}/browser-stream?session_id=${sessionId}`;

  ws = new WebSocket(url);

  ws.onopen = async () => {
    if (connectTimeout) { clearTimeout(connectTimeout); connectTimeout = null; }
    callBtn.classList.add('active');
    callBtn.querySelector('.icon').textContent = '📞';
    callBtn.querySelector('.label').textContent = 'End Call';
    callBtn.disabled = false;
    try {
      await startMic();
      if (audioCtx.state === 'suspended') await audioCtx.resume();
    } catch (err) {
      setStatus('Mic Error', 'error');
      addMessage('assistant', '[Error] Microphone access denied. Please allow microphone permissions.');
      disconnect();
      return;
    }
  };

  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    switch (data.type) {
      case 'session.ready':
        setStatus('Connected', 'connected');
        listeningDot.className = 'dot active';
        break;

      case 'transcript': {
        const role = data.role;
        const text = data.text;
        addMessage(role, text);
        if (role === 'assistant') {
          isAgentSpeaking = false;
          speakingDot.className = 'dot';
          listeningDot.className = 'dot active';
        }
        break;
      }

      case 'audio.delta':
        if (data.audio) {
          isAgentSpeaking = true;
          listeningDot.className = 'dot';
          speakingDot.className = 'dot speaking';
          queueAudio(data.audio);
        }
        break;

      case 'error':
        setStatus('Error', 'error');
        addMessage('assistant', '[Error] ' + (data.message || 'Unknown error'));
        break;
    }
  };

  ws.onclose = () => {
    if (isCallActive) disconnect();
  };

  ws.onerror = () => {
    if (isCallActive) {
      setStatus('Error', 'error');
      disconnect();
    }
  };
}

function disconnect() {
  if (connectTimeout) { clearTimeout(connectTimeout); connectTimeout = null; }
  isCallActive = false;
  isAgentSpeaking = false;
  audioQueue = [];
  isPlaying = false;
  if (ws) { ws.close(); ws = null; }
  stopMic();
  setStatus('Disconnected', '');
  listeningDot.className = 'dot';
  speakingDot.className = 'dot';
  callBtn.classList.remove('active');
  callBtn.querySelector('.icon').textContent = '📞';
  callBtn.querySelector('.label').textContent = 'Call Agent';
  callBtn.disabled = false;
}

// ─── Call button ───────────────────────────────────────────────────
let connectTimeout = null;

callBtn.addEventListener('click', () => {
  if (!isCallActive) {
    isCallActive = true;
    callBtn.disabled = true;
    callBtn.querySelector('.icon').textContent = '⏳';
    callBtn.querySelector('.label').textContent = 'Connecting';
    setStatus('Connecting...', '');
    transcriptEl.innerHTML = '';
    connectWS();
    connectTimeout = setTimeout(() => {
      if (isCallActive) {
        setStatus('Timeout', 'error');
        addMessage('assistant', '[Error] Connection timed out. Is the server running?');
        disconnect();
      }
    }, 10000);
  } else {
    disconnect();
    if (connectTimeout) { clearTimeout(connectTimeout); connectTimeout = null; }
  }
});


</script>
</body>
</html>
