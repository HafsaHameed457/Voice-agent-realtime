services:
  - type: web
    name: voice-agent-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn src.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: voice-agent-redis
          property: connectionString
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: STT_TIMEOUT
        value: "10.0"
      - key: LLM_TIMEOUT
        value: "15.0"
      - key: TTS_TIMEOUT
        value: "10.0"
      - key: SILENCE_TIMEOUT
        value: "1.0"
      - key: MIN_AUDIO_DURATION
        value: "0.5"
      - key: VAD_THRESHOLD
        value: "500"
    healthCheckPath: /health
    autoDeploy: true

  - type: web
    name: voice-agent-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://voice-agent-api.onrender.com
    autoDeploy: true

  - type: redis
    name: voice-agent-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
    maxmemoryPolicy: allkeys-lru

  - type: cron
    name: keep-alive
    schedule: "*/10 * * * *"
    runtime: python
    buildCommand: ""
    startCommand: curl -f https://voice-agent-api.onrender.com/health || exit 1
    envVars:
      - key: RENDER_API_KEY
        sync: false