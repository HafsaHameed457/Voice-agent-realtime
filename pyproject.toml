[project]
name = "voice-agent"
version = "0.1.0"
description = "Real-time voice agent with Groq + Kokoro"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "requests>=2.31",
    "pydub>=0.25",
    "redis>=5.0",
    "groq>=0.12",
    "edge-tts>=7.2",
]
[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
streamlit = [
    "streamlit>=1.35",
    "streamlit-webrtc>=0.47",
    "numpy>=1.26",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20", "W", "A", "C90", "PT", "PTH", "PGH", "PL", "TRY", "NPY", "PERF", "RSE", "RET", "FLY", "INP", "PIE", "TD", "ARG", "ASYNC", "LOG", "ERA", "PD", "PLW", "TCH", "RUF"]
ignore = ["S101", "PTH123", "TRY003"]
fixable = ["ALL"]
unfixable = ["T20", "EXE", "ERA"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "stubs"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
enable_error_code = ["ignore-without-code"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"